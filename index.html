<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Follow Up CR-7</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .box{background:#fff;border:1px solid #e6eaf0;border-radius:16px;padding:24px;box-shadow:0 8px 24px rgba(20,30,55,.08);max-width:520px}
  </style>
</head>
<body>
<div class="loading" id="loader">
  <div class="box">
    <h3>FOLLOW UP CR-7</h3>
    <p>Memuat aplikasi...</p>
  </div>
</div>
<script>
(async function(){
  const ORIGINAL_URL='https://raw.githubusercontent.com/mankyux-sketch/Follow-up-Cr7/9c4e1527f92d739638fe8a561442f80b09935a04/index.html';
  try{
    const res=await fetch(ORIGINAL_URL,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    let html=await res.text();

    const oldMenu='<button class="navbtn" data-page="templates">💬 Template WA</button>';
    const downloadMenu=`<button
      onclick="window.location.href='download.html'"
      style="width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:12px 13px;border-radius:10px;margin-bottom:6px;cursor:pointer;font-weight:700"
      onmouseover="this.style.background='#213957';this.style.color='#fff'"
      onmouseout="this.style.background='transparent';this.style.color='inherit'">📥 Download Excel</button>`;

    if(html.includes(oldMenu)){
      html=html.replace(oldMenu,downloadMenu+'\n    '+oldMenu);
    }else{
      throw new Error('Posisi menu CR-7 tidak ditemukan');
    }

    // Tambahkan penanda versi tanpa mengubah fungsi aplikasi.
    html=html.replace('>V5</span>','>V5 + EXCEL</span>');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.getElementById('loader').innerHTML=`
      <div class="box">
        <h3>CR-7 gagal dimuat</h3>
        <p>Silakan refresh halaman. Data Follow Up di browser tidak terhapus.</p>
        <p style="font-size:12px;color:#687386">${String(err.message||err)}</p>
      </div>`;
  }
})();
</script>
</body>
</html>
